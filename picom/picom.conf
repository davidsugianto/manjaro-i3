#
# ~/.config/picom/picom.conf — picom v13
#
# Tuned for an Intel laptop: enough polish to feel finished, cheap enough that
# it never costs you battery or makes scrolling stutter. Blur is limited to
# the bar and terminals rather than applied everywhere, which is where most
# picom configs start eating frames.

# ---------------------------------------------------------------------------
# backend
# ---------------------------------------------------------------------------

# glx is the right choice on Intel; `xrender` is the fallback if you ever see
# tearing or corruption.
backend = "glx";
vsync = true;

# use-damage only repaints what changed — the single biggest battery win.
use-damage = true;

# ---------------------------------------------------------------------------
# shadows
# ---------------------------------------------------------------------------

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#000000";

# No shadow on things that aren't really windows. Without these you get dark
# rectangles around dock struts, dropdown menus and the desktop background.
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Dunst'",
    "class_g = 'i3-frame'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'dnd'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "_GTK_FRAME_EXTENTS@",
    # Fullscreen windows don't need a shadow nobody can see. `fullscreen` is
    # picom v12+'s built-in condition — the old _NET_WM_STATE@[0]:32a form
    # still works but logs a deprecation warning for the :32a specifier.
    "fullscreen"
];

# ---------------------------------------------------------------------------
# fading
# ---------------------------------------------------------------------------

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

fade-exclude = [
    "class_g = 'Polybar'"
];

# ---------------------------------------------------------------------------
# opacity
# ---------------------------------------------------------------------------

# Terminals set their own background_opacity (0.94 in wezterm/kitty), so we
# don't double up here. These cover apps that can't do it themselves.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "92:class_g = 'Rofi'",
    "95:class_g = 'Dunst'",
    "88:class_g = 'XTerm'"
];

# ---------------------------------------------------------------------------
# blur
#
# Only behind the bar, the launcher and terminals. Blurring everything looks
# impressive in a screenshot and costs real frames in daily use.
# ---------------------------------------------------------------------------

blur: {
    method = "dual_kawase";
    strength = 4;
    background = false;
    background-frame = false;
    background-fixed = false;
};

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'dnd'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@"
];

# ---------------------------------------------------------------------------
# corners
# ---------------------------------------------------------------------------

corner-radius = 8;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    # A rounded fullscreen video is just clipped video.
    "fullscreen"
];

# ---------------------------------------------------------------------------
# general
# ---------------------------------------------------------------------------

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Don't redirect the whole screen for a single fullscreen window — this is what
# keeps fullscreen video and games running at full speed.
unredir-if-possible = true;
unredir-if-possible-exclude = [
    "class_g = 'Polybar'"
];

# Fixes flickering in some Electron/Chrome windows.
use-ewmh-active-win = true;

log-level = "warn";

wintypes:
{
    normal        = { fade = true;  shadow = true;  };
    tooltip       = { fade = true;  shadow = false; opacity = 0.95; focus = true; };
    dock          = { shadow = false; clip-shadow-above = true; };
    dnd           = { shadow = false; };
    popup_menu    = { shadow = false; opacity = 0.96; };
    dropdown_menu = { shadow = false; opacity = 0.96; };
    menu          = { shadow = false; };
    utility       = { shadow = false; };
    notification  = { shadow = true;  fade = true; };
    splash        = { shadow = false; };
};
