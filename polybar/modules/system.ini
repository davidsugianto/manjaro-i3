; Optional modules — not in the default bar.
;
; The stock layout leaves these out to keep things tidy on a 1366px panel.
; Add any of them to `modules-right` in config.ini if you want them:
;
;   modules-right = cpu memory filesystem music pulseaudio …

[module/cpu]
type = internal/cpu
interval = 2

format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.highlight}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3

format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.highlight}
label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.highlight}
label-mounted = %free%
label-unmounted =

; Pending pacman updates — IN the default bar (see modules-right).
; Uses checkupdates (pacman-contrib), which queries a temporary database
; rather than touching the real one, so running it on a timer is safe.
[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates
interval = 1800
format = <label>
format-prefix = "󰏔 "
label = %output%
; Replaces the pamac-tray applet, so clicking opens the same GUI that icon
; did. Falls back to a terminal upgrade on a machine without pamac.
click-left = ~/.config/polybar/scripts/updates-click
