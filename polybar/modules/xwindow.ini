; Focused window title — centred, muted grey.
;
; Inherits the bar's foreground rather than setting its own, so it sits back
; and lets the status cluster on the right read first.
;
; Truncated hard: a full Chrome tab title will happily eat the entire bar.

[module/xwindow]
type = internal/xwindow

label = %title%
label-maxlen = 45
label-empty =
