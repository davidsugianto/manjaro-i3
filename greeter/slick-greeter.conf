# lightdm-slick-greeter — installed to /etc/lightdm/slick-greeter.conf by
# install.sh (needs sudo; see the "greeter" step there).
#
# Why this file exists in the repo at all: slick-greeter ships no default
# config of its own. The settings below were only ever a hand-edited
# /etc/lightdm/slick-greeter.conf, so a package update was free to leave it as
# a .pacsave and revert the live file to slick-greeter's hardcoded defaults —
# a plain blue mesh background, no theme, no icon theme. That's silent: it
# only shows up the next time you look at the lock/login screen. Tracking it
# here means `./install.sh` puts it back after any such wipe.
#
# The background path below is a system location, not anywhere under $HOME:
# lightdm runs the greeter as its own user, and $HOME is mode 700, so it
# cannot read a wallpaper that lives under ~/Pictures. Keep it in sync with
# your desktop wallpaper using: sync-greeter-background

[Greeter]
background=/usr/share/backgrounds/wallpaperflar.jpg
background-color=#1a1b26
draw-grid=false
theme-name=Adapta-Nokto-Eta-Maia
icon-theme-name=Papirus-Adapta-Nokto-Maia
cursor-theme-name=breeze-cursors
font-name=Noto Sans 11
xft-antialias=true
xft-hintstyle=hintfull
enable-hidpi=auto
