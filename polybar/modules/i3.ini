; Workspaces.
;
; NOTE: the icon after the ';' must NOT be quoted — polybar renders quotes
; literally, so ws-icon-0 = term;"X" shows up as "X" with the marks. It is
; a bare glyph, and every codepoint here was checked against the installed
; JetBrainsMono Nerd Font with `fc-list :charset=<hex>`.
;
; i3 names its workspaces "1:term", "2:code", … (see the i3 config). We map
; each to a single glyph here rather than printing the name, because ten text
; labels do not fit on a 1366px bar. i3 keeps the readable names; polybar
; shows the icon. Best of both.

[module/i3]
type = internal/i3

; Only show workspaces that exist, in numeric order, pinned to this monitor.
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

ws-icon-0 = term;󰆍
ws-icon-1 = code;󰅩
ws-icon-2 = web;󰖟
ws-icon-3 = files;󰉋
ws-icon-4 = music;󰝙
ws-icon-5 = media;󰕧
ws-icon-6 = chat;󰭹
ws-icon-7 = docs;󰈙
ws-icon-8 = misc;󰒓
ws-icon-9 = sys;󰍛
ws-icon-default = 󰝦

format = <label-state><label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.dangerous}
label-mode-foreground = ${colors.background}

; focused — the workspace you're on. Blue, no underline: it's the only
; coloured element on the left half of the bar, which is emphasis enough.
label-focused = %icon%
label-focused-foreground = ${colors.highlight}
label-focused-padding = 1

; unfocused — exists, has windows, you're not on it
label-unfocused = %icon%
label-unfocused-foreground = ${colors.lowlight}
label-unfocused-padding = 1

; visible — shown on another monitor
label-visible = %icon%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

; urgent — something wants attention
label-urgent = %icon%
label-urgent-foreground = ${colors.dangerous}
label-urgent-padding = 1
