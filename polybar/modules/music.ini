; Now playing.
;
; Backed by playerctl, so it works with anything MPRIS-aware — Chrome/YouTube,
; mpv, VLC, Spotify, ncmpcpp via mpd. That's deliberately more useful than
; polybar's internal/mpd module, which only ever sees mpd.
;
; tail = true keeps one long-lived script instead of respawning it every
; second, so the scrolling title stays smooth.

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music
tail = true
interval = 1

format = <label>

label = %output%
label-maxlen = 28

; left  = play/pause     right = next
; middle= previous       scroll= volume on the playing app
click-left   = playerctl play-pause
click-right  = playerctl next
click-middle = playerctl previous
scroll-up    = playerctl volume 0.05+
scroll-down  = playerctl volume 0.05-
