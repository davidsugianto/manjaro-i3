; Power button — opens the rofi power menu.
;
; A plain glyph rather than a polybar menu, so there's exactly one power UI in
; the whole setup ($mod+Shift+e opens the same thing).

[module/powermenu]
type = custom/text

format = "󰐥"
format-foreground = ${colors.highlight}
format-padding = 1

click-left = ~/.config/rofi/scripts/powermenu
