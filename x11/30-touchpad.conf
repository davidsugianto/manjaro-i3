# /etc/X11/xorg.conf.d/30-touchpad.conf
#
# Touchpad defaults for the Synaptics pad on this Dell (DELL07AD:00 06CB:75E3),
# driven by xf86-input-libinput.
#
# This replaces Manjaro's stock file, which only enables tapping. The settings
# here are the ones that make a laptop pad feel like a trackpad rather than a
# hostile square: tap-to-click, two-finger scroll, natural direction, and —
# most importantly — disable-while-typing.
#
# Anything you change here needs a logout to apply. For live tweaking use
# `xinput set-prop`, which is what ~/.local/bin/input-setup does.

Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"

    # Tap to click, and two/three-finger taps for right/middle button.
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    # Tap-and-drag without holding the pad down.
    Option "TappingDrag" "on"
    Option "TappingDragLock" "off"

    # Two-finger scrolling, content follows fingers (like a phone).
    Option "ScrollMethod" "twofinger"
    Option "NaturalScrolling" "true"
    Option "HorizontalScrolling" "true"

    # Clickfinger: click anywhere with one finger for left, two for right.
    # More reliable than software button zones on a clickpad this size.
    Option "ClickMethod" "clickfinger"
    Option "MiddleEmulation" "on"

    # Ignore the pad while typing — the single biggest quality-of-life win.
    Option "DisableWhileTyping" "on"

    # Adaptive accel with a mild speed bump. Range is -1 to 1; 0.3 suits a
    # small 1366x768 screen where you don't need to cross many pixels.
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.3"

    Option "LeftHanded" "off"
    Option "SendEventsMode" "enabled"
EndSection
