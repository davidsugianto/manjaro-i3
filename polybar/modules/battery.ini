; Battery.
;
; One of the few modules that gets a colour at rest — blue, matching the
; reference bar. It drops to yellow then red as it drains, so the colour
; change is the signal rather than the presence of colour.
;
; battery/adapter are the directory names under /sys/class/power_supply —
; BAT0 and AC on this machine. Check with `ls /sys/class/power_supply` if you
; move these dotfiles to another laptop.

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 15
poll-interval = 5

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%
label-charging-foreground = ${colors.healthy}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.highlight}

format-full = <label-full>
label-full = "󰁹 100%"
label-full-foreground = ${colors.highlight}

; Below low-at (15%) polybar switches to these and the icon goes red.
format-low = <animation-low> <label-low>
label-low = %percentage%%
label-low-foreground = ${colors.dangerous}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-0-foreground = ${colors.dangerous}
ramp-capacity-1-foreground = ${colors.warning}
ramp-capacity-2-foreground = ${colors.highlight}
ramp-capacity-3-foreground = ${colors.highlight}
ramp-capacity-4-foreground = ${colors.highlight}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
animation-charging-foreground = ${colors.healthy}
animation-charging-framerate = 700

animation-low-0 = 󰂃
animation-low-1 = 󰁻
animation-low-foreground = ${colors.dangerous}
animation-low-framerate = 900
