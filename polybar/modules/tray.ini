; System tray.
;
; Since 3.7 the tray is a module rather than a set of tray-* keys in the bar
; section — the old `tray-position = right` style is deprecated. Place it in
; modules-right wherever you want the icons to sit.

[module/tray]
type = internal/tray

tray-spacing = 6pt
tray-padding = 2pt
tray-size = 68%
tray-background = ${colors.transparent}
