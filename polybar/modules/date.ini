; Clock — split into two modules so the day and the time each get their own
; icon, the way the reference bar does it (📅 Thu   🕐 08:50).

[module/date]
type = internal/date
interval = 30

date = %a
date-alt = %a %d %b %Y

format = <label>
format-prefix = "󰃭 "
label = %date%

[module/time]
type = internal/date
interval = 5

time = %H:%M
time-alt = %H:%M:%S

format = <label>
format-prefix = "󰥔 "
label = %time%
