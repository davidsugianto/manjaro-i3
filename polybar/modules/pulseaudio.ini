; Volume.
;
; internal/pulseaudio talks to pipewire-pulse (the PulseAudio shim), so you
; need the pipewire-pulse package installed and its user service running —
; install.sh handles both. Without it this module silently shows nothing.

[module/pulseaudio]
type = internal/pulseaudio

; Use the PulseAudio sink volume rather than a fixed step so the bar agrees
; with whatever `bin/volume` did.
use-ui-max = false
interval = 5
reverse-scroll = false

format-volume = <ramp-volume> <label-volume>

label-volume = %percentage%%

format-muted = <label-muted>
label-muted = "󰝟 "
label-muted-foreground = ${colors.dangerous}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
; No colour at rest — it only turns red when muted, so colour = a state
; you might not have noticed, not just "here is the volume".

; Left click opens the mixer, right click toggles mute.
click-right = pavucontrol
