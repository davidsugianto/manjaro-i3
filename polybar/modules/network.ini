; Networking — two modules, one per interface.
;
; Both are in modules-right; each hides itself when its interface is down, so
; in practice you only ever see the one carrying traffic.
;
; Shows throughput rather than the SSID, matching the reference bar's
; "▼ 0 KB/s". The network name is one keypress away ($mod+Shift+w) or a click
; on this module, so the bar doesn't need to spend ~150px of a 1366px panel
; spelling out "Kontrakan k43 1 4G_EXT".
;
; Want the name instead? label-connected = %essid% with maxlen 9.
; Want upload too? %downspeed:3% %upspeed:3% — but it gets wide on this screen.
;
; Interface names came from `ls /sys/class/net` on this machine.

[module/wlan]
type = internal/network
interface = wlp2s0
interface-type = wireless
interval = 3

format-connected = <ramp-signal> <label-connected>
label-connected = %downspeed:3%

; Nothing at all when the radio is off — no dead "disconnected" text.
format-disconnected =

ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨

click-left = ~/.config/rofi/scripts/wifi

[module/eth]
type = internal/network
interface = enp3s0
interface-type = wired
interval = 3

format-connected = <label-connected>
label-connected = "󰈀 %downspeed:3%"

format-disconnected =
