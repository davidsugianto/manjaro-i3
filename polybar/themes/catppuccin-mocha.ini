; Catppuccin Mocha — polybar palette.
;
; Deliberately kept to a small set of *roles* rather than a big list of hues.
; Every module references these names only, so swapping to tokyo-night.ini,
; dracula.ini or gruvbox.ini re-themes the whole bar without touching a single
; module.

[colors]
background       = #1e1e2e
background-alt   = #181825
foreground       = #cdd6f4
foreground-alt   = #bac2de

highlight        = #89b4fa
highlight-alt    = #cba6f7

lowlight         = #6c7086

healthy          = #a6e3a1
warning          = #f9e2af
dangerous        = #f38ba8

; Slightly translucent bar background — picom blurs behind it.
transparent      = #cc1e1e2e
