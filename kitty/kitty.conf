# ~/.config/kitty/kitty.conf — kitty 0.48
#
# WezTerm is the primary terminal in this setup (see wezterm/wezterm.lua).
# kitty is here as a fully-configured alternative — some people prefer its
# performance and its image protocol. To make it the default, change $term in
# the i3 config to `kitty`.

# ---------------------------------------------------------------------------
# theme
# ---------------------------------------------------------------------------
include themes/tokyonight.conf
# include themes/dracula.conf
# include themes/gruvbox.conf

# ---------------------------------------------------------------------------
# font
# ---------------------------------------------------------------------------

font_family      family="JetBrainsMono Nerd Font" style=Medium
bold_font        family="JetBrainsMono Nerd Font" style=Bold
italic_font      family="JetBrainsMono Nerd Font" style=Italic
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"

font_size 10.5
modify_font cell_height 105%

# Disable ligatures while the cursor is on the group, so you can still edit
# inside a `=>` without it reflowing under you.
disable_ligatures cursor

symbol_map U+E000-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# ---------------------------------------------------------------------------
# window
# ---------------------------------------------------------------------------

window_padding_width 8 10
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.94
dynamic_background_opacity yes

remember_window_size  no
initial_window_width  110c
initial_window_height 30c

# ---------------------------------------------------------------------------
# tabs — thin, since tmux does the heavy lifting
# ---------------------------------------------------------------------------

tab_bar_edge   top
tab_bar_style  powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}  {title}"

# ---------------------------------------------------------------------------
# behaviour
# ---------------------------------------------------------------------------

scrollback_lines 10000
scrollback_pager_history_size 64

cursor_shape beam
cursor_blink_interval 0

enable_audio_bell no
visual_bell_duration 0.1

copy_on_select no
strip_trailing_spaces smart
mouse_hide_wait 2.0
detect_urls yes
url_style curly

shell zsh --login
term xterm-kitty
shell_integration enabled

allow_remote_control no
update_check_interval 0

# ---------------------------------------------------------------------------
# keys — kept minimal so tmux keeps its bindings
# ---------------------------------------------------------------------------

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+equal   change_font_size all +0.5
map ctrl+minus   change_font_size all -0.5
map ctrl+0       change_font_size all 0
map ctrl+shift+f show_scrollback
map ctrl+shift+n new_os_window
map ctrl+shift+t new_tab_with_cwd
