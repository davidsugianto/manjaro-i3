; ~/.config/polybar/config.ini — polybar 3.7.2
;
; Styled after the bar in mino29/arch-i3. The defining traits of that look:
;
;   * full width, flush to the top edge — no floating, no rounded corners
;   * opaque background, same colour as the desktop
;   * text is MUTED GREY by default, not white; colour is used sparingly and
;     therefore actually means something when it appears
;   * every module is an icon + a value, with generous space between them
;   * focused window title sits in the centre
;   * no separators, no pills, no underlines
;
; Structure:
;   themes/*.ini    colour roles only — swap one line to re-theme the bar
;   modules/*.ini   one file per module, each with its own [module/x] header
;   scripts/*       the custom modules' backing scripts
;
; Reload with `~/.config/polybar/launch.sh` (or $mod+Shift+r in i3).

; ---------------------------------------------------------------------------
; theme — change this ONE line to switch the whole bar
; ---------------------------------------------------------------------------
include-file = ~/.config/polybar/themes/tokyo-night.ini
;include-file = ~/.config/polybar/themes/dracula.ini
;include-file = ~/.config/polybar/themes/gruvbox.ini

; ---------------------------------------------------------------------------
; bar
; ---------------------------------------------------------------------------

[bar/main]
; MONITOR is exported by launch.sh so the same bar definition works on the
; laptop panel and on any external display.
monitor = ${env:MONITOR:}
monitor-strict = false

; Full width, flush to the top. No offsets and no radius — this is what makes
; the bar read as part of the desktop rather than a floating widget.
width  = 100%
height = 28pt
offset-x = 0
offset-y = 0
radius = 0

; Opaque, matching the desktop background exactly.
background = ${colors.background}

; The important one: default text is the MUTED colour. Individual modules opt
; into a brighter colour only where it earns attention (battery, power, an
; urgent workspace, a muted mic). Everything else recedes.
foreground = ${colors.lowlight}

line-size = 2pt
border-size = 0
padding-left = 2
padding-right = 2
; Gaps between modules. The reference bar uses ~30px gaps at 1920px wide;
; module-margin = 1 gives ~17px here, which is the same proportion on a
; 1366px panel — and crucially leaves enough room for the centred window
; title to actually sit in the centre rather than being shoved left.
module-margin = 1

; JetBrainsMono carries the text; the Symbols font is an explicit fallback so
; glyphs render at a consistent size instead of whatever fontconfig picks.
; The trailing ;N is a vertical offset in pixels — it optically centres the
; glyphs against the text baseline.
font-0 = JetBrainsMono Nerd Font:style=Medium:size=10;2
font-1 = Symbols Nerd Font Mono:size=13;3
font-2 = Noto Color Emoji:scale=10;2

; Workspaces left, focused window title centred, status cluster right.
modules-left   = i3
modules-center = xwindow
modules-right  = updates wlan eth bluetooth date time music pulseaudio backlight battery powermenu tray

; override-redirect = false means the bar is a normal managed dock window, so
; i3 reserves space for it and stacks it correctly on its own. `wm-restack = i3`
; is only needed when override-redirect is true — setting both just logs
; "Ignoring restack of i3 window" on every start.
override-redirect = false

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; ---------------------------------------------------------------------------
; modules
; ---------------------------------------------------------------------------
include-file = ~/.config/polybar/modules/i3.ini
include-file = ~/.config/polybar/modules/xwindow.ini
include-file = ~/.config/polybar/modules/date.ini
include-file = ~/.config/polybar/modules/music.ini
include-file = ~/.config/polybar/modules/pulseaudio.ini
include-file = ~/.config/polybar/modules/backlight.ini
include-file = ~/.config/polybar/modules/network.ini
include-file = ~/.config/polybar/modules/battery.ini
include-file = ~/.config/polybar/modules/bluetooth.ini
include-file = ~/.config/polybar/modules/tray.ini
include-file = ~/.config/polybar/modules/powermenu.ini
include-file = ~/.config/polybar/modules/system.ini

; ---------------------------------------------------------------------------
; global
; ---------------------------------------------------------------------------

[settings]
; Rebuild the bar when displays change, so plugging in a monitor doesn't
; leave you with a bar stranded on a disconnected output.
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
