# ~/.config/tmux/tmux.conf — tmux 3.7
#
# Self-contained: no plugin manager, no oh-my-tmux. Everything here is stock
# tmux, so it keeps working after an upgrade and you can read the whole thing
# in one sitting.
#
# Prefix is C-a (screen-style). C-b is left alone so readline's
# backward-char still works.

# ---------------------------------------------------------------------------
# general
# ---------------------------------------------------------------------------

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# tmux-256color gives correct italics/undercurl; the -sa line adds truecolor
# for terminals that advertise it. WezTerm and xterm both do.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,wezterm:Tc"
set -ga terminal-features ",*:usstyle"
set -g extended-keys on  # lets modified Enter/Tab/etc. reach apps like pi

set -g mouse on
set -sg escape-time 10          # don't swallow Escape in vim
set -g repeat-time 500
set -g history-limit 50000
set -g focus-events on
set -g display-time 2000
set -g display-panes-time 2000

set -g base-index 1             # windows start at 1 — matches the keyboard
setw -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S  #W"

set -g status-interval 5
setw -g aggressive-resize on

# ---------------------------------------------------------------------------
# keys
# ---------------------------------------------------------------------------

# Reload.
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits that keep the current directory, with mnemonics that match the visual
# result (| is a vertical bar → vertical split).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation. -r allows repeating without re-pressing prefix.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows.
bind -r p previous-window
bind -r n next-window
bind Tab last-window
bind X kill-pane
bind Q kill-window

# Zoom the current pane to fullscreen and back.
bind f resize-pane -Z

# Quick session switcher.
bind s choose-tree -Zs

# Move the current pane into a new window and back again.
bind b break-pane -d
bind @ join-pane -h -s !

# ---------------------------------------------------------------------------
# copy mode — vi keys, clipboard-integrated
# ---------------------------------------------------------------------------

setw -g mode-keys vi
bind Enter copy-mode

bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Escape send -X cancel

# Middle-click paste and drag-select both land in the X clipboard.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Paste from the X clipboard.
bind p run "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"

# ---------------------------------------------------------------------------
# appearance — Catppuccin Mocha
#
# One colour block; change these to re-theme. TokyoNight, Dracula and Gruvbox
# equivalents are at the bottom, commented out.
# ---------------------------------------------------------------------------

%hidden BG="#1e1e2e"
%hidden BG_ALT="#181825"
%hidden BG_HL="#313244"
%hidden FG="#cdd6f4"
%hidden FG_ALT="#bac2de"
%hidden MUTED="#6c7086"
%hidden ACCENT="#89b4fa"
%hidden ACCENT_ALT="#cba6f7"
%hidden OK="#a6e3a1"
%hidden WARN="#f9e2af"
%hidden URGENT="#f38ba8"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=${BG_ALT},fg=${FG_ALT}"

# Left: session name in a solid accent block.
set -g status-left-length 30
set -g status-left "#[bg=${ACCENT},fg=${BG_ALT},bold]  #S #[bg=${BG_ALT},fg=${ACCENT},none]  "

# Right: prefix indicator, then the date/time. Deliberately sparse — polybar
# already shows battery and network, and duplicating them is noise.
set -g status-right-length 60
set -g status-right "#[fg=${URGENT}]#{?client_prefix,󰘳 PREFIX  ,}#[fg=${MUTED}]#{?window_zoomed_flag,󰊓 zoom  ,}#[fg=${FG_ALT}]%H:%M #[fg=${MUTED}]%d %b "

# Windows.
setw -g window-status-format "#[fg=${MUTED}] #I #W "
setw -g window-status-current-format "#[bg=${BG_HL},fg=${ACCENT},bold] #I #W "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=${WARN}"
setw -g window-status-bell-style "fg=${URGENT}"

# Panes — the active border picks up the accent so it's obvious at a glance.
set -g pane-border-style "fg=${BG_HL}"
set -g pane-active-border-style "fg=${ACCENT}"
set -g pane-border-lines single

# Messages and the command prompt.
set -g message-style "bg=${ACCENT},fg=${BG_ALT},bold"
set -g message-command-style "bg=${BG_HL},fg=${FG}"

# Copy-mode selection.
setw -g mode-style "bg=${BG_HL},fg=${ACCENT}"

# Dim inactive panes very slightly so the focused one reads first.
set -g window-style "fg=${FG_ALT}"
set -g window-active-style "fg=${FG}"

set -g clock-mode-colour "${ACCENT}"
set -g clock-mode-style 24

