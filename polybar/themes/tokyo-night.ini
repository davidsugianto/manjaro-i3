; TokyoNight (Night) — polybar palette.
;
; Deliberately kept to a small set of *roles* rather than a big list of hues.
; Every module references these names only, so swapping to dracula.ini or
; gruvbox.ini re-themes the whole bar without touching a single module.

[colors]
background       = #1a1b26
background-alt   = #16161e
foreground       = #c0caf5
foreground-alt   = #a9b1d6

highlight        = #7aa2f7
highlight-alt    = #bb9af7

lowlight         = #565f89

healthy          = #9ece6a
warning          = #e0af68
dangerous        = #f7768e

; Slightly translucent bar background — picom blurs behind it.
transparent      = #cc1a1b26
