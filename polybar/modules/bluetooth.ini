; Bluetooth — replaces the blueman-applet tray icon.
;
; The point of this module is visual consistency: the tray applet rendered a
; full-colour GTK icon at a different size and weight from every other icon in
; the bar. This is a Nerd Font glyph like the rest.
;
; left click  → blueman-manager (also provides the pairing agent, which the
;               applet used to supply — you need it running to pair something
;               new, so launching it on demand covers that)
; right click → toggle the adapter on/off

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth
interval = 5

; The script emits its own %{F...} colour tag for the connected state, so no
; format-foreground here — it would override the tag.
format = <label>
label = %output%

click-left = blueman-manager
click-right = ~/.config/polybar/scripts/bluetooth-toggle
