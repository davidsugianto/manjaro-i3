; Screen brightness.
;
; card is the directory name under /sys/class/backlight. This laptop reports
; intel_backlight; on AMD it's usually amdgpu_bl0. Since 3.7 polybar picks the
; first usable card automatically if you omit this, but naming it explicitly
; avoids surprises when a dummy acpi_video0 also exists.

[module/backlight]
type = internal/backlight
card = intel_backlight

; actual_brightness reflects what the panel is really doing (default true
; since 3.7). poll-interval covers drivers that don't emit udev events.
use-actual-brightness = true
poll-interval = 0

enable-scroll = true

format = <ramp> <label>
label = %percentage%%

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
