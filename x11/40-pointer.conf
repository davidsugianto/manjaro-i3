# /etc/X11/xorg.conf.d/40-pointer.conf
#
# External mice (this laptop pairs with a Logitech M240).
#
# Deliberately the opposite of the touchpad on two counts:
#
#   * NaturalScrolling off — a wheel should scroll the page down when you push
#     it away from you. Matching the touchpad here feels wrong to almost
#     everyone, because a wheel isn't a surface you're dragging.
#
#   * AccelProfile flat — 1:1 movement with no acceleration curve. Predictable
#     is better than fast once you're used to it, and it's what you want for
#     anything precise (design tools, games, image editing).
#
# Raise AccelSpeed above 0 if the mouse feels sluggish; the range is -1 to 1.

Section "InputClass"
    Identifier "pointer catchall"
    Driver "libinput"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/event*"
    # Explicitly exclude touchpads, which also match MatchIsPointer.
    MatchIsTouchpad "off"

    Option "NaturalScrolling" "false"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0"
    Option "MiddleEmulation" "off"
    # "wheel" is the physical scroll wheel. Do NOT set this to "button" — that
    # means hold-a-button-and-move-to-scroll, and disables the wheel entirely.
    Option "ScrollMethod" "wheel"
    Option "LeftHanded" "off"
EndSection
